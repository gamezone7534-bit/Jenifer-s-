<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="60%" stop-color="#0b132e"/>
      <stop offset="100%" stop-color="#070b19"/>
    </radialGradient>
    <radialGradient id="orbGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#818cf8"/>
      <stop offset="80%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#070b19" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="micGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#6366f1" stroke-width="4" stroke-opacity="0.3"/>

  <!-- Glowing Orb Aura -->
  <circle cx="256" cy="240" r="160" fill="url(#orbGlow)" filter="url(#glow)"/>

  <!-- Halo Ring -->
  <circle cx="256" cy="240" r="140" fill="none" stroke="#38bdf8" stroke-width="3" stroke-dasharray="16 12" stroke-opacity="0.6"/>

  <!-- Microphone Icon -->
  <g transform="translate(196, 160)" filter="url(#glow)">
    <!-- Mic Body -->
    <rect x="36" y="16" width="48" height="84" rx="24" fill="url(#micGrad)"/>
    <!-- Mic Arc Cradle -->
    <path d="M 12 68 C 12 108, 108 108, 108 68" fill="none" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <!-- Stem and Base -->
    <line x1="60" y1="108" x2="60" y2="136" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
    <line x1="32" y1="136" x2="88" y2="136" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Bottom Brand Text -->
  <text x="256" y="430" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" letter-spacing="4" fill="#38bdf8">JENIFER AI</text>
  <text x="256" y="460" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="16" letter-spacing="2" fill="#a5b4fc">VOICE ASSISTANT</text>
</svg>
